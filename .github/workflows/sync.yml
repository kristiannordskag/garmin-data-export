name: Manual Garmin Sync
on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: pip install requests

    - name: Process Web Session and Fetch Data
      env:
        GARMIN_COOKIES: ${{ secrets.GARMIN_COOKIES }}
      run: |
        # Write the browser session cookie directly to the workspace
        echo "$GARMIN_COOKIES" > cookies.json
        
        # Pulls the active session securely bypassing the SSO login endpoint
        python -c "
        import json, requests
        with open('cookies.json') as f:
            cookies = {c['name']: c['value'] for c in json.load(f)}
        
        # Request data directly from the user summary API using your active session
        res = requests.get('https://connect.garmin.com/usersummary-service/statistics/user/dailySummary', cookies=cookies)
        with open('index.html', 'w') as out:
            out.write(res.text)
        "

    - name: Push to Live Link
      run: |
        git config --global user.name 'Garmin Manual Bot'
        git config --global user.email 'bot@github.com'
        git add index.html
        git commit -m "Manual browser-cookie sync update" || exit 0
        git push
