name: Manual Garmin Sync
on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: pip install garminconnect garth python-dotenv

    - name: Create Env File and Fetch Garmin Cloud Data
      env:
        GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
        GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
      run: |
        # Inject secrets into a .env file that the script automatically reads
        echo "GARMIN_EMAIL=$GARMIN_EMAIL" > .env
        echo "GARMIN_PASSWORD=$GARMIN_PASSWORD" >> .env
        
        # Run the script cleanly with only valid flags
        python garmin_export.py --compact --days 3

    - name: Format for Webpage
      run: |
        mkdir -p export
        mv export/garmin_export_*.txt index.html || echo "No file found"

    - name: Push to Live Link
      run: |
        git config --global user.name 'Garmin Manual Bot'
        git config --global user.email 'bot@github.com'
        git add index.html
        git commit -m "Manual health sync update" || exit 0
        git push
